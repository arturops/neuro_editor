# fly.toml app configuration file generated for em-viewer-cremi-a on 2026-10-31T19:06:37-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'em-viewer-cremi-a'
primary_region = 'ewr'

[build]
[env]
  BLOCK_SIZE = '8,64,64'
  CROP_SIZE= '16,512,512'
  DATA_DIR = '/data'
  PORT = '8080'
  VIEWER_MODE = 'per_user'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
