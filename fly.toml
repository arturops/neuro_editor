# Change `app` to a name nobody else has, e.g. em-viewer-<yourname>.
app = "em-viewer-cremi-a"
primary_region = "ewr"   # pick one near you; run `fly platform regions`

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  VIEWER_MODE = "per_user"
  BLOCK_SIZE = "4,32,32"
  # PUBLIC_URL and VIEWER_TOKENS are secrets: see README, step "Deploy to Fly.io"

[mounts]
  source = "em_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
