[project]
name = "em-viewer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arturo Parrales", email = "arturo.ps14@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
